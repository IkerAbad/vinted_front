<div class="bg-primary">
<!-- Header Start -->
<div class="container-fluid bg-primary py-5 mb-5 page-header">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10 text-center">
        <h1 class="display-3 text-white animated slideInDown">Productos</h1>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-center">
            <li class="breadcrumb-item"><a class="text-white" href="#">Home</a></li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</div>
<!-- Header End -->
<!-- Courses Start -->
<div class="container-xxl py-5">
  <div class="container">
      <div class="text-center wow fadeInUp" data-wow-delay="0.1s">
          <h6 class="section-title bg-white text-center text-primary px-3">Home</h6>
          <h1 class="mb-5">Productos Destacados</h1>
      </div>
      <div class="row g-4 justify-content-center">
          <div class="col-lg-4 col-md-6 wow fadeInUp" data-wow-delay="0.1s" *ngFor="let pet of productos">
              <div class="course-item bg-light">
                  <div class="position-relative overflow-hidden">
                      <img class="img-fluid" src="../../plantilla/img/image.jpg" alt="">
                      <div class="w-100 d-flex justify-content-center position-absolute bottom-0 start-0 mb-4">
                          <a href="#" class="flex-shrink-0 btn btn-sm btn-primary px-3 border-end" style="border-radius: 30px 0 0 30px;">Read More</a>
                          <a href="#" class="flex-shrink-0 btn btn-sm btn-primary px-3" style="border-radius: 0 30px 30px 0;">Join Now</a>
                      </div>
                  </div>
                  <div class="text-center p-4 pb-0">
                      <h3 class="mb-0">{{ pet.nombre }}</h3>

                      <div class="mb-3">
                          <small class="fa fa-star text-primary"></small>
                          <small class="fa fa-star text-primary"></small>
                          <small class="fa fa-star text-primary"></small>
                          <small class="fa fa-star text-primary"></small>
                          <small class="fa fa-star text-primary"></small>
                          <small>{{pet.estado}}</small>
                      </div>
                      <h5 class="mb-4">{{pet.detalles}}</h5>
                      <h5 class="mb-4">{{pet.marca}}</h5>
                  </div>
                  <div class="d-flex border-top">
                      <small class="flex-fill text-center border-end py-2"><i class="fa fa-user-tie text-primary me-2"></i>{{pet.categoria}}</small>
                      <small class="flex-fill text-center border-end py-2"><i class="fa fa-clock text-primary me-2"></i>{{pet.talla}}</small>
                      <small class="flex-fill text-center py-2"><i class="fa fa-user text-primary me-2"></i>{{pet.precio}}€</small>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
<!-- Courses End -->
<div class="container">
  <header class="jumbotron">
    <h1 class="mb-5">Todos los productos</h1>
    <div *ngFor="let pet of productos" class="row">
      <div class="col-md">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title">{{ pet.nombre }}</h4>
            <p class="card-text">{{ pet.detalles }}</p>
            <p class="card-text">{{pet.precio}}€</p>
          </div>
        </div>
      </div>
    </div>

  </header>

</div>

</div>
