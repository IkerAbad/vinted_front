<div class="col-md">
  <div class="card">
    <div class="card-body">
      <h1 class="mb-5">{{producto.nombre}}</h1>
      <a href="#" routerLink="/producto/index" class="btn btn-primary">Back</a>
      <div>
        <strong>ID:</strong>
        <p>{{ producto.id }}</p>
      </div>
      <div>
        <strong>Nombre:</strong>
        <p>{{ producto.nombre }}</p>
      </div>
      <div>
        <strong>detalles:</strong>
        <p>{{ producto.detalles }}</p>
      </div>

      <div>
        <strong>estado:</strong>
        <p>{{ producto.estado }}</p>
      </div>

      <div>
        <strong>marca:</strong>
        <p>{{ producto.marca }}</p>
      </div>

      <div>
        <strong>talla:</strong>
        <p>{{ producto.talla }}</p>
      </div>

      <div>
        <strong>Precio:</strong>
        <p>{{ producto.precio }}</p>
      </div>
    </div>
  </div>
</div>
